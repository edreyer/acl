name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17 runs the tests on the oldest supported JDK; 21 (listed last) builds.
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test and lint
        run: ./gradlew build

      - name: Test on JDK 17
        run: ./gradlew testMinimumJdk -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64

      # Builds the artifacts exactly as they are published (unsigned), so packaging breaks here, not at release time.
      - name: Package
        run: ./gradlew publishToMavenLocal

      - name: Check javadoc jar is not empty
        run: unzip -l build/libs/acl-*-javadoc.jar | grep -q 'index.html'

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/
